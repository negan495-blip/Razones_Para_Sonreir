<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>¡Feliz Cumpleaños!</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050515;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .instruction {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      pointer-events: none;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="instruction">✨ Arrastra con el dedo para explorar el espacio ✨</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050515, 0.0015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 400;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xff007f, 2, 600);
    pointLight1.position.set(200, 200, 200);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x00f3ff, 2, 600);
    pointLight2.position.set(-200, -200, -200);
    scene.add(pointLight2);

    const starsGeometry = new THREE.BufferGeometry();
    const count = 3000;
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 1200;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starsMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.8,
      transparent: true,
      opacity: 0.8
    });

    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // AQUÍ PUEDES CAMBIAR LAS FRASES POR LAS QUE TÚ QUIERAS:
    const frases = [
      "¡Feliz Cumpleaños!",
      "Eres una persona increíble ✨",
      "Que todos tus sueños se cumplan 🚀",
      "¡Disfruta mucho tu día!",
      "Gracias por estar siempre 🌟",
      "Un año más de aventuras 🎉",
      "¡Salud y mucha felicidad!"
    ];

    const textGroup = new THREE.Group();

    frases.forEach((texto, idx) => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;

      ctx.fillStyle = "rgba(0,0,0,0)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "Bold 52px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
      gradient.addColorStop(0, '#00f3ff');
      gradient.addColorStop(0.5, '#ffffff');
      gradient.addColorStop(1, '#ff007f');
      ctx.fillStyle = gradient;

      ctx.shadowColor = "#ff007f";
      ctx.shadowBlur = 15;
      ctx.fillText(texto, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);

      const angle = (idx / frases.length) * Math.PI * 2;
      const radius = 250 + (Math.random() * 80 - 40);
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = (Math.random() - 0.5) * 200;
      sprite.position.z = Math.sin(angle) * radius;

      sprite.scale.set(180, 45, 1);
      textGroup.add(sprite);
    });

    scene.add(textGroup);

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    function onPointerDown(e) {
      isDragging = true;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      previousMousePosition = { x, y };
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaX = x - previousMousePosition.x;
      const deltaY = y - previousMousePosition.y;
      scene.rotation.y += deltaX * 0.005;
      scene.rotation.x += deltaY * 0.005;
      previousMousePosition = { x, y };
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown);
    window.addEventListener('touchmove', onPointerMove);
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        scene.rotation.y += 0.0015;
      }
      starField.rotation.y -= 0.0003;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
