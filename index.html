<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Especial!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0913;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .instruction {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            pointer-events: none;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
    <!-- Three.js para la animación 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="instruction">✨ Haz clic o arrastra para moverte • Toca los mensajes flotantes ✨</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0913);
        scene.fog = new THREE.FogExp2(0x1a0913, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Luz ambiental y direccional
        const ambientLight = new THREE.AmbientLight(0xffb7c5, 0.7);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.2, 50);
        pointLight.position.set(0, 15, 10);
        scene.add(pointLight);

        // Suelo con brillo sutil
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c1220, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        scene.add(floor);

        // Crear árboles de cerezo estilizados (Troncos y follaje rosado)
        function createCherryTree(x, z, scale = 1) {
            const treeGroup = new THREE.Group();

            // Tronco
            const trunkGeo = new THREE.CylinderGeometry(0.4 * scale, 0.8 * scale, 8 * scale, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.8 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2 * scale;
            treeGroup.add(trunk);

            // Follaje en esferas rosadas
            const leavesMat = new THREE.MeshStandardMaterial({ 
                color: 0xffb7c5, 
                roughness: 0.6,
                emissive: 0x331122 
            });

            const puffs = [
                { pos: [0, 6, 0], size: 3.5 },
                { pos: [1.5, 5, 1], size: 2.5 },
                { pos: [-1.5, 5.5, -1], size: 2.8 },
                { pos: [0, 7.5, -1.2], size: 2.2 },
            ];

            puffs.forEach(p => {
                const puffGeo = new THREE.SphereGeometry(p.size * scale, 7, 7);
                const puffMesh = new THREE.Mesh(puffGeo, leavesMat);
                puffMesh.position.set(p.pos[0] * scale, p.pos[1] * scale, p.pos[2] * scale);
                treeGroup.add(puffMesh);
            });

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        // Añadir varios árboles alrededor
        createCherryTree(-8, -5, 1.2);
        createCherryTree(9, -7, 1.0);
        createCherryTree(-5, -12, 1.5);
        createCherryTree(7, -10, 1.3);

        // Pétalos cayendo
        const petalCount = 150;
        const petalGeo = new THREE.PlaneGeometry(0.4, 0.4);
        const petalMat = new THREE.MeshBasicMaterial({ 
            color: 0xffc0cb, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8
        });

        const petals = [];
        for (let i = 0; i < petalCount; i++) {
            const petal = new THREE.Mesh(petalGeo, petalMat);
            petal.position.set(
                (Math.random() - 0.5) * 30,
                Math.random() * 20,
                (Math.random() - 0.5) * 30
            );
            petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            scene.add(petal);
            petals.push({
                mesh: petal,
                speedY: 0.03 + Math.random() * 0.04,
                speedX: 0.01 + Math.random() * 0.02,
                rotSpeed: 0.02 + Math.random() * 0.03
            });
        }

        // Mensajes flotantes 3D
        const messages = [
            "🌸 ¡Feliz Cumpleaños! 🌸",
            "Que cada día esté lleno de alegría",
            "Gracias por tu hermosa amistad",
            "Eres una persona increíble",
            "¡Disfruta mucho tu día al máximo!",
            "Muchos éxitos y grandes sonrisas"
        ];

        const textSprites = [];
        messages.forEach((text, index) => {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = 'Bold 36px Segoe UI, Arial';
            context.fillStyle = '#ffb7c5';
            context.shadowColor = '#000000';
            context.shadowBlur = 8;
            context.fillText(text, 10, 50);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            
            const angle = (index / messages.length) * Math.PI * 2;
            const radius = 9;
            sprite.position.set(
                Math.cos(angle) * radius,
                3 + (index % 2) * 2,
                Math.sin(angle) * radius
            );
            sprite.scale.set(6, 3, 1);
            scene.add(sprite);
            textSprites.push({ sprite, angle, radius });
        });

        // Controles de cámara táctil / mouse
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition.x = e.clientX; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            cameraAngle -= deltaX * 0.005;
            camera.position.x = Math.sin(cameraAngle) * 25;
            camera.position.z = Math.cos(cameraAngle) * 25;
            camera.lookAt(0, 3, 0);
            previousMousePosition.x = e.clientX;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // Animación fluida
        function animate() {
            requestAnimationFrame(animate);

            // Caída de pétalos
            petals.forEach(p => {
                p.mesh.position.y -= p.speedY;
                p.mesh.position.x += Math.sin(Date.now() * 0.002 + p.mesh.position.y) * 0.02;
                p.mesh.rotation.x += p.rotSpeed;
                p.mesh.rotation.y += p.rotSpeed;

                if (p.mesh.position.y < -2) {
                    p.mesh.position.y = 20;
                    p.mesh.position.x = (Math.random() - 0.5) * 30;
                }
            });

            // Rotación suave de mensajes
            textSprites.forEach(t => {
                t.angle += 0.003;
                t.sprite.position.x = Math.cos(t.angle) * t.radius;
                t.sprite.position.z = Math.sin(t.angle) * t.radius;
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
